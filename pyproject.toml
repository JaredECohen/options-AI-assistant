[project]
name = "options-chatbot"
version = "0.2.0"
description = "OptionsCoach.AI — options strategy explainer, payoff calculator and options analytics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "cachetools>=5.3",
  "anthropic>=2.6,<3",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "thetadata>=1.0.17,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query() defaults are the framework idiom.
# UP007: pydantic models keep Optional/Union for readability with older clients.
ignore = ["E501", "B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
# Moved verbatim from the 3,101-line chat_service.py (T7); renaming would break
# the byte-identical characterization guarantee for no behavioural gain.
"app/chat/*" = ["E741", "B007"]
"app/core/*" = ["E741"]
"app/providers/llm/heuristic.py" = ["E741"]
"eval/*" = ["E741"]
