# Install from lockfiles only. No repository secrets and no paid API calls:
# pytest blocks non-loopback network, and the frontend build does not call providers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.27"
          python-version: "3.13"
      - name: Install from uv.lock
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from package-lock.json
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
