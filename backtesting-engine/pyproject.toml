[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtesting-engine"
version = "0.1.0"
description = "A clear, EOD, per-bar event-driven backtesting engine for equities and options."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jared Cohen" }]
keywords = ["backtesting", "options", "equities", "quant", "finance"]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14.0",        # Parquet on-disk cache
  "scipy>=1.11",          # normal CDF/PDF for Black-Scholes greeks
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pre-commit>=3.7",
  "requests>=2.31",       # live HTTP for FMP / Alpha Vantage adapters
  "types-requests>=2.31",
]
http = ["requests>=2.31"]

[tool.hatch.build.targets.wheel]
packages = ["src/backtesting_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B027: optional lifecycle hooks on the Strategy ABC are intentionally empty
# (not abstract) so subclasses only override what they need.
ignore = ["B008", "B027"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backtesting_engine"]
branch = true
