# Render Blueprint for OptionsCoach. PREPARED, NOT APPLIED: creating these
# resources costs money and needs the owner's approval (docs/RUNBOOK.md step 3).
# Separate from MarketMosaic's blueprint: own services, own database, own
# release lifecycle. Keys follow https://render.com/docs/blueprint-spec
# (runtime, autoDeployTrigger; the deprecated env/autoDeploy keys are not used).
# Plan names and region are UNRESOLVED choices; the values below are the
# smallest documented paid tier and MarketMosaic's region so private networking
# to MarketMosaic is possible (same region + workspace required).

services:
  - type: web
    name: optionscoach-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon            # UNRESOLVED: must match MarketMosaic's region for private networking
    plan: 0.5c-512mb          # UNRESOLVED: confirm in the Render dashboard before applying
    numInstances: 1
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: "off"  # deploys are explicit until production acceptance
    envVars:
      - key: APP_ENV
        value: staging
      - key: PUBLIC_BASE_URL
        value: https://options-staging.marketmosaic.ai
      - key: ALLOWED_ORIGINS
        value: https://options-staging.marketmosaic.ai
      - key: AUTH_ENABLED
        value: "true"
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://options-staging.marketmosaic.ai
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWT_TEMPLATE
        value: marketmosaic
      - key: ENTITLEMENTS_SOURCE
        value: marketmosaic
      - key: MARKETMOSAIC_BASE_URL
        sync: false               # Render internal host:port of MarketMosaic web, e.g. http://<internal-host>:10000
      - key: MARKETMOSAIC_SERVICE_TOKEN
        sync: false
      - key: OC_SERVICE_TOKEN_HASHES_JSON
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: optionscoach-db-staging
          property: connectionString
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: LLM_FALLBACK
        value: none
      - key: LLM_USER_DAILY_TOKEN_BUDGET
        value: "200000"
      - key: LLM_GLOBAL_DAILY_TOKEN_BUDGET
        value: "2000000"
      - key: OPTIONS_PROVIDER
        value: tradier
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_DATA_STATUS
        value: delayed            # change only after the entitlement is confirmed in writing
      - key: RESEARCH_INTEGRATION_ENABLED
        value: "false"            # enable after MarketMosaic ships /api/v1/research and /api/v1/entitlements

  # Worker: only needed once ingestion is approved (P3). Same image, different entrypoint.
  # Kept commented so applying the blueprint never creates it by accident.
  # - type: worker
  #   name: optionscoach-worker-staging
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: python -m app.worker
  #   region: oregon
  #   plan: 0.5c-512mb
  #   envVars:
  #     - key: APP_ENV
  #       value: staging
  #     - key: ENABLE_SCHEDULER
  #       value: "1"
  #     - key: INGEST_UNIVERSE
  #       value: SPY,QQQ,IWM
  #     - key: DATABASE_URL
  #       fromDatabase: {name: optionscoach-db-staging, property: connectionString}
  #     - key: OPTIONS_PROVIDER
  #       value: tradier
  #     - key: TRADIER_API_TOKEN
  #       sync: false

databases:
  - name: optionscoach-db-staging
    region: oregon
    plan: basic-256mb           # UNRESOLVED: confirm plan name and size; OptionsCoach's own DB, never MarketMosaic's
    postgresMajorVersion: "16"
    ipAllowList: []             # internal connections only
