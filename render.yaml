# Render Blueprint for OptionsCoach. Separate from MarketMosaic: own service,
# own database. Keys follow https://render.com/docs/blueprint-spec.
# The live web service `optionscoach` and Postgres `optionscoach-db` were created
# through the Render API on 2026-11-09, not by syncing this file. DATABASE_URL
# below is the intended wiring and is still unset on that service until the
# blueprint is synced onto the existing resources or the variable is linked in
# the dashboard. Secrets (sync: false) are entered by the owner, never here.

services:
  - type: web
    name: optionscoach
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon            # same region as MarketMosaic
    plan: free                # 0.5c-512mb ($7/mo) removes cold starts
    numInstances: 1
    # Free plan: no pre-deploy step, so scripts/start.sh migrates on boot (MIGRATE_ON_START).
    # On a paid plan with >1 instance, use preDeployCommand: alembic upgrade head instead.
    autoDeployTrigger: commit
    # Liveness only. GET /health does not touch Postgres or paid providers.
    # GET /ready checks the database and is not the deploy health path.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://options.marketmosaic.ai
      - key: ALLOWED_ORIGINS
        value: https://options.marketmosaic.ai
      - key: AUTH_ENABLED
        value: "true"
      - key: CLERK_ISSUER
        value: https://clerk.marketmosaic.ai
      - key: CLERK_JWKS_URL
        value: https://clerk.marketmosaic.ai/.well-known/jwks.json
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://options.marketmosaic.ai
      - key: CLERK_PUBLISHABLE_KEY
        sync: false               # public value, same as MarketMosaic's (served by its /api/public/config)
      - key: CLERK_JWT_TEMPLATE
        value: marketmosaic
      - key: ENTITLEMENTS_SOURCE
        value: marketmosaic
      - key: MARKETMOSAIC_BASE_URL
        value: https://marketmosaic.ai  # public URL: free services cannot receive private traffic, and MM's internal port is 8000
      - key: MARKETMOSAIC_SERVICE_TOKEN
        sync: false
      - key: OC_SERVICE_TOKEN_HASHES_JSON
        sync: false
      # Not a literal. Render fills this from optionscoach-db's internal
      # connection string on blueprint sync. Do not commit that URL.
      - key: DATABASE_URL
        fromDatabase:
          name: optionscoach-db
          property: connectionString
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: LLM_FALLBACK
        value: none
      - key: LLM_USER_DAILY_TOKEN_BUDGET
        value: "200000"
      - key: LLM_GLOBAL_DAILY_TOKEN_BUDGET
        value: "2000000"
      - key: OPTIONS_PROVIDER
        value: tradier
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_ENV
        value: production          # sandbox if the token is a Tradier sandbox token
      - key: TRADIER_DATA_STATUS
        value: delayed            # change only after the entitlement is confirmed in writing
      # ThetaData through its Python library (no Terminal). The owner enters the secrets in the dashboard.
      - key: THETADATA_EMAIL
        sync: false
      - key: THETADATA_PASSWORD
        sync: false
      - key: OPTIONS_HISTORY_PROVIDER   # live smoke check passed 2026-11-08 (RUNBOOK section 7)
        value: thetadata
      # One free web service, no worker service: run the job queue (backtests, IV
      # backfills) in the web process. Remove if a worker service is added.
      - key: EMBEDDED_WORKER
        value: "1"
      - key: RESEARCH_INTEGRATION_ENABLED
        value: "true"             # MarketMosaic /api/v1 shipped 2026-11-08 (PR #138)

  # Worker: only needed once ingestion is approved (P3). Same image, different entrypoint.
  # Kept commented so applying the blueprint never creates it by accident.
  # - type: worker
  #   name: optionscoach-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: python -m app.worker
  #   region: oregon
  #   plan: 0.5c-512mb
  #   envVars:
  #     - key: APP_ENV
  #       value: production
  #     - key: ENABLE_SCHEDULER
  #       value: "1"
  #     - key: INGEST_UNIVERSE
  #       value: SPY,QQQ,IWM
  #     - key: DATABASE_URL
  #       fromDatabase: {name: optionscoach-db, property: connectionString}
  #     - key: OPTIONS_PROVIDER
  #       value: tradier
  #     - key: TRADIER_API_TOKEN
  #       sync: false

databases:
  - name: optionscoach-db
    region: oregon
    plan: 0.1c-256mb            # $6/mo + 1 GB storage; OptionsCoach's own DB, never MarketMosaic's
    diskSizeGB: 1
    postgresMajorVersion: "16"
    ipAllowList: []             # internal connections only
